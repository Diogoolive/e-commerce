<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Minha Loja</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="container" style="max-width: 400px; margin: 50px auto; padding: 20px;">
        <h2>Login de Usuário</h2>
        
        <form id="login-form">
            <div style="margin-bottom: 15px;">
                <label for="email">E-mail:</label><br>
                <input type="email" id="email" required style="width: 100%; padding: 8px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="password">Senha:</label><br>
                <input type="password" id="password" required style="width: 100%; padding: 8px;">
            </div>

            <button type="submit" class="btn" style="width: 100%;">Entrar</button>
        </form>
        
        <!-- RODAPÉ ATUALIZADO COM LINK PARA CADASTRO -->
        <div style="margin-top: 20px; text-align: center; font-size: 14px;">
            <p>Ainda não tem uma conta? <a href="cadastro.html" style="color: #007bff; text-decoration: none;">Cadastre-se aqui</a></p>
            <p style="margin-top: 8px;"><a href="index.html" style="color: #555;">← Voltar para a Loja</a></p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
